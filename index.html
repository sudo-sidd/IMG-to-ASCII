<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>ASCII Shader Converter — WebGL (Three.js)</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #030a03;
    --panel-bg: #030a03;
    --fg:       #33ff33;
    --fg-dim:   #1a8c1a;
    --fg-bright:#aaff44;
    --border:   #1a5c1a;
    --border-hi:#33ff33;
    --glow:     0 0 6px #33ff33, 0 0 12px rgba(51,255,51,0.4);
    --glow-sm:  0 0 4px rgba(51,255,51,0.6);
    --font:     'Share Tech Mono', 'Courier New', Courier, monospace;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
  }

  /* CRT scanline + vignette overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 9999;
    background:
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.18) 2px,
        rgba(0,0,0,0.18) 4px
      ),
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
  }

  /* Scrollbar */
  #ui::-webkit-scrollbar { width: 6px; }
  #ui::-webkit-scrollbar-track { background: #000; }
  #ui::-webkit-scrollbar-thumb { background: var(--border); }
  #ui::-webkit-scrollbar-thumb:hover { background: var(--fg-dim); }

  /* Sidebar */
  #ui {
    position: absolute;
    z-index: 30;
    left: 12px;
    top: 12px;
    width: 300px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 16px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-sizing: border-box;
    box-shadow: var(--glow);
  }

  /* Sidebar header bar */
  #ui::before {
    content: '[ ASCII-CONVERTER v2.0 ]';
    display: block;
    color: var(--fg-bright);
    font-size: 11px;
    letter-spacing: 2px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: -4px;
    text-shadow: var(--glow-sm);
  }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 14px;
  }

  .panel-section:last-of-type {
    border-bottom: none;
    padding-bottom: 0;
  }

  .section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--fg-dim);
    font-weight: normal;
  }

  .section-title::before { content: '> '; color: var(--fg); }

  /* Drop area */
  #drop {
    width: 100%;
    height: 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--border-hi);
    color: var(--fg-dim);
    cursor: pointer;
    background: transparent;
    transition: color 0.15s, border-color 0.15s;
    font-size: 12px;
    text-align: center;
    padding: 0 12px;
    box-sizing: border-box;
    gap: 4px;
  }

  #drop:hover {
    color: var(--fg-bright);
    border-color: var(--fg-bright);
    text-shadow: var(--glow-sm);
  }

  /* Labels */
  label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--fg-dim);
  }

  label span {
    color: var(--fg-bright);
    text-shadow: var(--glow-sm);
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* Range slider */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    background: transparent;
  }

  input[type=range]:focus { outline: none; }

  input[type=range]::-webkit-slider-runnable-track {
    height: 3px;
    background: var(--border);
    border: none;
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    height: 13px;
    width: 7px;
    border-radius: 0;
    background: var(--fg);
    cursor: pointer;
    margin-top: -5px;
    box-shadow: var(--glow-sm);
  }

  input[type=range]::-webkit-slider-thumb:hover {
    background: var(--fg-bright);
  }

  /* Checkbox */
  input[type=checkbox] {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border: 1px solid var(--fg-dim);
    border-radius: 0;
    outline: none;
    cursor: pointer;
    background: transparent;
    position: relative;
    flex-shrink: 0;
  }

  input[type=checkbox]:checked {
    background: transparent;
    border-color: var(--fg);
    box-shadow: var(--glow-sm);
  }

  input[type=checkbox]:checked::after {
    content: 'X';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--fg);
    font-size: 10px;
    font-family: var(--font);
    text-shadow: var(--glow-sm);
  }

  /* Select */
  select {
    width: 100%;
    padding: 5px 8px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--fg);
    font-family: var(--font);
    font-size: 12px;
    outline: none;
    cursor: pointer;
  }

  select:focus {
    border-color: var(--fg);
    box-shadow: var(--glow-sm);
  }

  optgroup, option {
    background: #000;
    color: var(--fg);
  }

  /* Button container */
  .btn-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 2px;
  }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  button {
    padding: 8px 12px;
    border-radius: 0;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-dim);
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  button:hover {
    border-color: var(--fg);
    color: var(--fg);
    text-shadow: var(--glow-sm);
    box-shadow: inset 0 0 10px rgba(51,255,51,0.06);
  }

  button:active { background: rgba(51,255,51,0.08); }

  /* Copy button — bright accent */
  #copyText {
    border-color: var(--fg);
    color: var(--fg);
    text-shadow: var(--glow-sm);
    box-shadow: var(--glow-sm);
    letter-spacing: 1.5px;
  }

  #copyText:hover {
    background: rgba(51,255,51,0.1);
    box-shadow: var(--glow);
  }

  /* Preset chips */
  .preset-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .preset-chip {
    padding: 3px 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-dim);
    font-family: var(--font);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    border-radius: 0;
  }

  .preset-chip:hover {
    border-color: var(--fg);
    color: var(--fg);
    text-shadow: var(--glow-sm);
  }

  .preset-chip.active {
    border-color: var(--fg-bright);
    color: var(--fg-bright);
    background: rgba(51,255,51,0.07);
    text-shadow: var(--glow-sm);
  }

  /* Number input */
  .res-custom-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    align-items: center;
  }

  input[type=number] {
    width: 100%;
    padding: 5px 8px;
    background: #000;
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--fg);
    font-family: var(--font);
    font-size: 12px;
    outline: none;
    box-sizing: border-box;
    -moz-appearance: textfield;
  }

  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }

  input[type=number]:focus {
    border-color: var(--fg);
    box-shadow: var(--glow-sm);
  }

  .apply-btn {
    padding: 5px 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg-dim);
    font-family: var(--font);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    border-radius: 0;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .apply-btn:hover {
    border-color: var(--fg);
    color: var(--fg);
    text-shadow: var(--glow-sm);
  }

  .res-info {
    font-size: 11px;
    color: var(--fg-dim);
    font-family: var(--font);
    text-align: right;
  }

  /* Main layout */
  #mainContainer {
    display: flex;
    width: 100vw;
    height: 100vh;
    padding-left: 324px;
    box-sizing: border-box;
  }

  #leftPanel, #rightPanel {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 12px;
    box-sizing: border-box;
    gap: 8px;
  }

  #originalContainer, #asciiContainer {
    flex: 1;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    background: #000;
  }

  #originalCanvas, #asciiCanvas {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  .panelLabel {
    color: var(--fg);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: var(--glow-sm);
  }

  .panelLabel::before { content: '>> '; }

  footer {
    position: absolute;
    right: 16px;
    bottom: 12px;
    z-index: 40;
    color: var(--fg-dim);
    font-family: var(--font);
    font-size: 11px;
    letter-spacing: 1px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #000;
    border: 1px solid var(--fg);
    color: var(--fg);
    padding: 10px 18px;
    font-family: var(--font);
    font-size: 12px;
    letter-spacing: 1px;
    text-shadow: var(--glow-sm);
    box-shadow: var(--glow);
    z-index: 100;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.show {
    transform: translateY(0);
    opacity: 1;
  }

  .toast.err {
    border-color: #ff3333;
    color: #ff4444;
    box-shadow: 0 0 8px #ff3333;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div id="toast" class="toast">
  <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
  <span id="toastMessage">ASCII copied!</span>
</div>

<div id="ui">
  <div class="panel-section">
    <div id="drop">
      <span style="letter-spacing:2px;">[ LOAD FILE ]</span>
      <span style="font-size: 11px;">image / video &mdash; drop or click</span>
    </div>
    <input id="file" type="file" accept="video/*,image/*" style="display:none"/>
  </div>

  <div class="panel-section">
    <div class="section-title">Resolution / Scale</div>

    <div class="control-group">
      <label>Quick presets <span>(width)</span></label>
      <div class="preset-chips">
        <button class="preset-chip" data-w="320">320</button>
        <button class="preset-chip" data-w="480">480</button>
        <button class="preset-chip" data-w="640">640</button>
        <button class="preset-chip" data-w="960">960</button>
        <button class="preset-chip active" data-w="0">Original</button>
      </div>
    </div>

    <div class="control-group">
      <label>Custom width (px)</label>
      <div class="res-custom-row">
        <input id="resWidth" type="number" min="64" max="4096" step="8" placeholder="e.g. 800" />
        <button class="apply-btn" id="applyRes">Apply</button>
      </div>
      <div class="res-info" id="resInfo">—</div>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Background</div>
    <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <label>Model Quality</label>
      <select id="bgQualitySelect" style="width: 120px;">
        <option value="small">Small (Fast)</option>
        <option value="medium">Medium (Balanced)</option>
        <option value="large" selected>Large (Best)</option>
      </select>
    </div>
    <div class="control-group">
      <button id="removeBgBtn">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
        </svg>
        Remove Background
      </button>
    </div>
    <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-top: 4px;">
      <label>Bg Color</label>
      <input id="bgColorPicker" type="color" value="#000000" style="padding: 0; width: 24px; height: 24px; background: transparent; border: 1px solid var(--border); cursor: pointer;" />
    </div>
    <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-top: 4px;">
      <label>Transparent</label>
      <input id="bgTransparent" type="checkbox" checked />
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Grid Configuration</div>
    <div class="control-group">
      <label>Cell size: <span id="cellVal">8</span> px</label>
      <input id="cell" type="range" min="4" max="24" value="8" />
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Visual Adjustments</div>
    
    <div class="control-group">
      <label>Gamma: <span id="gammaVal">1.00</span></label>
      <input id="gamma" type="range" min="0.2" max="2.5" step="0.05" value="1.0" />
    </div>

    <div class="control-group">
      <label>Edge Threshold: <span id="edgeThresholdVal">0.10</span></label>
      <input id="edgeThreshold" type="range" min="0.01" max="0.5" step="0.01" value="0.1" />
    </div>

    <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-top: 4px;">
      <label>Draw Edges</label>
      <input id="drawEdges" type="checkbox" checked />
    </div>

    <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-top: 4px;">
      <label>Draw Fill</label>
      <input id="drawFill" type="checkbox" checked />
    </div>
  </div>

  <div class="panel-section">
    <div class="section-title">Color & Theme</div>
    
    <div class="control-group" style="flex-direction: row; justify-content: space-between; align-items: center; margin-bottom: 4px;">
      <label>Colorize Output</label>
      <input id="colorize" type="checkbox" checked />
    </div>

    <div class="control-group">
      <label>Theme Preset</label>
      <select id="theme">
        <option value="none">None (Full Color)</option>
        <option value="bw">Black & White</option>
        <optgroup label="Dark Themes">
          <option value="onedark">OneDark</option>
          <option value="catppuccin">Catppuccin</option>
          <option value="solarized">Solarized</option>
          <option value="gruvbox">Gruvbox</option>
        </optgroup>
        <optgroup label="High Contrast">
          <option value="highcontrast">High Contrast</option>
          <option value="highcontrastinv">High Contrast Inverted</option>
          <option value="monochrome">Monochrome</option>
          <option value="greyscale">Greyscale</option>
        </optgroup>
        <optgroup label="Soft Themes">
          <option value="cream">Cream</option>
          <option value="pastel">Pastel Blue</option>
          <option value="sepia">Sepia</option>
          <option value="sage">Sage Green</option>
          <option value="lavender">Lavender</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="btn-container">
    <div class="btn-row">
      <button id="playPause">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        Play
      </button>
      <button id="snapshot">
        <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Save
      </button>
    </div>
    <button id="copyText">
      <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      Copy ASCII
    </button>
  </div>
</div>

<div id="mainContainer">
  <div id="leftPanel">
    <div class="panelLabel">Original Source</div>
    <div id="originalContainer">
      <canvas id="originalCanvas"></canvas>
    </div>
  </div>
  <div id="rightPanel">
    <div class="panelLabel">ASCII Preview</div>
    <div id="asciiContainer">
      <canvas id="asciiCanvas"></canvas>
    </div>
  </div>
</div>
<footer>ASCII Shader Converter — WebGL | Drag a file to start</footer>

<!-- Three.js (r132+ recommended) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
/* ==== Config and utility helpers ==== */
const THEMES = {
  none: { bg: '#000000', fg: '#ffffff', accent: '#808080' },
  bw: { bg: '#000000', fg: '#ffffff', accent: '#808080' },
  onedark: { bg: '#282c34', fg: '#abb2bf', accent: '#61afef' },
  catppuccin: { bg: '#1e1e2e', fg: '#cdd6f4', accent: '#f5c2e7' },
  solarized: { bg: '#002b36', fg: '#93a1a1', accent: '#b58900' },
  gruvbox: { bg: '#282828', fg: '#ebdbb2', accent: '#fabd2f' },
  // High contrast themes
  highcontrast: { bg: '#000000', fg: '#ffffff', accent: '#ffffff' },
  highcontrastinv: { bg: '#ffffff', fg: '#000000', accent: '#000000' },
  // Monochrome themes
  monochrome: { bg: '#1a1a1a', fg: '#e0e0e0', accent: '#888888' },
  greyscale: { bg: '#2d2d2d', fg: '#d3d3d3', accent: '#a0a0a0' },
  // Softer themes - corrected for better contrast
  cream: { bg: '#faf8f0', fg: '#5c4317', accent: '#8b6914' },
  pastel: { bg: '#f5f9ff', fg: '#2c5282', accent: '#3182ce' },
  sepia: { bg: '#f7f5f0', fg: '#4a3528', accent: '#744c3c' },
  sage: { bg: '#f8faf6', fg: '#2d5016', accent: '#38a169' },
  lavender: { bg: '#faf8ff', fg: '#44337a', accent: '#6b46c1' }
};

const fileInput = document.getElementById('file');
const drop = document.getElementById('drop');
const originalCanvas = document.getElementById('originalCanvas');
const asciiCanvas = document.getElementById('asciiCanvas');
const playPauseBtn = document.getElementById('playPause');
const snapshotBtn = document.getElementById('snapshot');

let currentFile = null;
let currentSource = null;
let rawImageElement = null;   // original Image element for re-scaling
let originalImageW = 0;       // native width of loaded image
let originalImageH = 0;       // native height of loaded image
let activeScaleW = 0;         // 0 = use original

/* ==== Three.js setup ==== */
let renderer, scene, camera, quadMesh, asciiMaterial;
let originalRenderer, originalScene, originalCamera, originalQuad;
let videoTexture = null;
let imageTexture = null;
let inputIsVideo = false;
let vidElement = null;
let clock = new THREE.Clock();

function initThree() {
  // ASCII renderer (right panel)
  renderer = new THREE.WebGLRenderer({ canvas: asciiCanvas, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  renderer.setSize(asciiCanvas.clientWidth, asciiCanvas.clientHeight, false);

  scene = new THREE.Scene();
  camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

  // Original renderer (left panel)
  originalRenderer = new THREE.WebGLRenderer({ canvas: originalCanvas, antialias: false });
  originalRenderer.setPixelRatio(window.devicePixelRatio || 1);
  originalRenderer.setSize(originalCanvas.clientWidth, originalCanvas.clientHeight, false);

  originalScene = new THREE.Scene();
  originalCamera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

  const plane = new THREE.PlaneGeometry(2,2);
  asciiMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uInput: { value: null },
      uEdgesASCII: { value: null },
      uFillASCII: { value: null },
      uCell: { value: 8.0 },
      uRes: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      uImageRes: { value: new THREE.Vector2(1.0, 1.0) },
      uColorize: { value: 1.0 },
      uPalette0: { value: new THREE.Vector3(0.282,0.2,0.2) },
      uPalette1: { value: new THREE.Vector3(0.8,0.8,0.8) },
      uGamma: { value: 1.0 },
      uTime: { value: 0.0 },
      uEdgeThreshold: { value: 0.1 },
      uDrawEdges: { value: true },
      uDrawFill: { value: true }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = vec4(position,1.0); }
    `,
    fragmentShader: `
      precision highp float;
      uniform sampler2D uInput;
      uniform sampler2D uEdgesASCII;
      uniform sampler2D uFillASCII;
      uniform vec2 uRes;
      uniform vec2 uImageRes;
      uniform float uCell;
      uniform float uColorize;
      uniform vec3 uPalette0;
      uniform vec3 uPalette1;
      uniform float uGamma;
      uniform float uTime;
      uniform float uEdgeThreshold;
      uniform bool uDrawEdges;
      uniform bool uDrawFill;
      varying vec2 vUv;

      #define PI 3.14159265358979323846

      // Luminance calculation like Acerola's
      float luminance(vec3 color) {
        return max(0.00001, dot(color, vec3(0.2127, 0.7152, 0.0722)));
      }

      // Simple edge detection using Sobel operator
      vec2 sobel(vec2 coord, vec2 resolution) {
        vec2 texelSize = 1.0 / resolution;
        
        float tl = luminance(texture2D(uInput, coord + vec2(-texelSize.x, -texelSize.y)).rgb);
        float tm = luminance(texture2D(uInput, coord + vec2(0.0, -texelSize.y)).rgb);
        float tr = luminance(texture2D(uInput, coord + vec2(texelSize.x, -texelSize.y)).rgb);
        float ml = luminance(texture2D(uInput, coord + vec2(-texelSize.x, 0.0)).rgb);
        float mr = luminance(texture2D(uInput, coord + vec2(texelSize.x, 0.0)).rgb);
        float bl = luminance(texture2D(uInput, coord + vec2(-texelSize.x, texelSize.y)).rgb);
        float bm = luminance(texture2D(uInput, coord + vec2(0.0, texelSize.y)).rgb);
        float br = luminance(texture2D(uInput, coord + vec2(texelSize.x, texelSize.y)).rgb);

        float sobelX = (tr + 2.0*mr + br) - (tl + 2.0*ml + bl);
        float sobelY = (bl + 2.0*bm + br) - (tl + 2.0*tm + tr);
        
        return vec2(sobelX, sobelY);
      }

      void main(){
        // Use direct UV coordinates to maintain exact input resolution and aspect ratio
        vec2 pixelCoord = vUv * uImageRes;
        
        // Get the cell position using uCell size
        ivec2 cellCoord = ivec2(floor(pixelCoord / uCell));
        
        // Position within the cell (0 to uCell-1)
        ivec2 localCoord = ivec2(mod(pixelCoord, uCell));
        
        // Sample color at cell center for luminance calculation
        vec2 cellCenterUV = (vec2(cellCoord) + 0.5) * uCell / uImageRes;
        vec3 cellColor = texture2D(uInput, cellCenterUV).rgb;
        float cellLuminance = pow(luminance(cellColor), 1.0/uGamma); // Apply gamma
        
        // Edge detection
        vec2 gradient = sobel(cellCenterUV, uImageRes);
        float edgeMagnitude = length(gradient);
        float theta = atan(gradient.y, gradient.x);
        
        // Quantize edge direction to 4 directions (like Acerola's shader)
        int direction = -1;
        if (edgeMagnitude > uEdgeThreshold) {
          float absTheta = abs(theta) / PI;
          
          if ((absTheta >= 0.0 && absTheta < 0.05) || (absTheta > 0.9 && absTheta <= 1.0)) {
            direction = 0; // VERTICAL (note: Acerola's mapping)
          } else if (absTheta > 0.45 && absTheta < 0.55) {
            direction = 1; // HORIZONTAL
          } else if (absTheta > 0.05 && absTheta < 0.45) {
            direction = theta > 0.0 ? 3 : 2; // DIAGONAL 1
          } else if (absTheta > 0.55 && absTheta < 0.9) {
            direction = theta > 0.0 ? 2 : 3; // DIAGONAL 2
          }
        }
        
        vec3 ascii = vec3(0.0);
        
        if (direction >= 0 && uDrawEdges) {
          // Sample from edge ASCII texture using pixel coordinates
          // Scale localCoord to 8x8 range for texture sampling
          vec2 scaledLocal = vec2(localCoord) * 8.0 / uCell;
          vec2 edgeTexCoord = vec2(scaledLocal.x + float(direction) * 8.0, 8.0 - scaledLocal.y);
          ascii = texture2D(uEdgesASCII, edgeTexCoord / vec2(40.0, 8.0)).rgb;
        } else if (uDrawFill) {
          // Sample from fill ASCII texture based on luminance
          // Use direct luminance mapping - bright areas get sparse characters, dark areas get dense characters
          float quantizedLum = clamp(floor(cellLuminance * 10.0), 0.0, 9.0);
          vec2 scaledLocal = vec2(localCoord) * 8.0 / uCell;
          vec2 fillTexCoord = vec2(scaledLocal.x + quantizedLum * 8.0, scaledLocal.y);
          ascii = texture2D(uFillASCII, fillTexCoord / vec2(80.0, 8.0)).rgb;
        }
        
        // Color mapping (like Acerola's lerp)
        vec3 bgColor = uPalette0;
        vec3 fgColor = mix(uPalette1, cellColor * uColorize, uColorize);
        vec3 finalColor = mix(bgColor, fgColor, ascii.r);
        
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `
  });

  quadMesh = new THREE.Mesh(plane, asciiMaterial);
  scene.add(quadMesh);

  // Simple material for original image display with aspect ratio preservation
  const originalMaterial = new THREE.ShaderMaterial({
    uniforms: {
      uTexture: { value: null },
      uAspect: { value: 1.0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main(){ 
        vUv = uv; 
        gl_Position = vec4(position, 1.0); 
      }
    `,
    fragmentShader: `
      uniform sampler2D uTexture;
      uniform float uAspect;
      varying vec2 vUv;
      
      void main(){
        // Center UV and apply aspect ratio correction
        vec2 centeredUV = (vUv - 0.5);
        
        // Scale UV to fit image aspect ratio within container
        if (uAspect > 1.0) {
          // Wide image - scale vertically
          centeredUV.y *= uAspect;
        } else {
          // Tall image - scale horizontally  
          centeredUV.x /= uAspect;
        }
        
        centeredUV += 0.5;
        
        // Check bounds and sample texture
        if (centeredUV.x < 0.0 || centeredUV.x > 1.0 || centeredUV.y < 0.0 || centeredUV.y > 1.0) {
          gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
        } else {
          gl_FragColor = texture2D(uTexture, centeredUV);
        }
      }
    `
  });
  originalQuad = new THREE.Mesh(plane, originalMaterial);
  originalScene.add(originalQuad);

  // Load the original AcerolaFX ASCII textures
  const textureLoader = new THREE.TextureLoader();
  
  // Load edges ASCII texture
  const edgesTexture = textureLoader.load('./edgesASCII.png', function(texture) {
    texture.minFilter = THREE.NearestFilter;
    texture.magFilter = THREE.NearestFilter;
    texture.needsUpdate = true;
    asciiMaterial.uniforms.uEdgesASCII.value = texture;
  });
  
  // Load fill ASCII texture  
  const fillTexture = textureLoader.load('./fillASCII.png', function(texture) {
    texture.minFilter = THREE.NearestFilter;
    texture.magFilter = THREE.NearestFilter;
    texture.needsUpdate = true;
    asciiMaterial.uniforms.uFillASCII.value = texture;
  });

  // Create a default test texture when no input is loaded
  createDefaultTexture();

  window.addEventListener('resize', onResize);
  
  // Add ResizeObserver to handle canvas container resizing
  const resizeObserver = new ResizeObserver(() => {
    onResize();
  });
  resizeObserver.observe(asciiCanvas.parentElement);
  resizeObserver.observe(originalCanvas.parentElement);
  
  onResize();
  animate();
}

function createDefaultTexture() {
  // Create a simple gradient test texture
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  // Create a gradient from black to white
  const gradient = ctx.createLinearGradient(0, 0, 256, 256);
  gradient.addColorStop(0, '#000000');
  gradient.addColorStop(0.5, '#808080');
  gradient.addColorStop(1, '#ffffff');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  
  // Add some color patches for testing
  ctx.fillStyle = '#ff0000';
  ctx.fillRect(50, 50, 50, 50);
  ctx.fillStyle = '#00ff00';
  ctx.fillRect(150, 50, 50, 50);
  ctx.fillStyle = '#0000ff';
  ctx.fillRect(100, 150, 50, 50);
  
  const defaultTexture = new THREE.CanvasTexture(canvas);
  defaultTexture.needsUpdate = true;
  
  // Set default image resolution
  asciiMaterial.uniforms.uImageRes.value.set(256, 256);
  
  // Set texture for both ASCII and original display
  asciiMaterial.uniforms.uInput.value = defaultTexture;
  originalQuad.material.uniforms.uTexture.value = defaultTexture;
  originalQuad.material.uniforms.uAspect.value = 1.0; // Square aspect ratio
  originalQuad.material.needsUpdate = true;
  
  // Save source for CPU side ASCII copying
  currentSource = canvas;
}

function onResize(){
  const asciiRect = asciiCanvas.getBoundingClientRect();
  const originalRect = originalCanvas.getBoundingClientRect();
  
  // For original canvas, always match display size for proper scaling
  originalRenderer.setSize(originalRect.width, originalRect.height, false);
  
  // For ASCII canvas, use image resolution if available, otherwise use display size
  const imageRes = asciiMaterial.uniforms.uImageRes.value;
  if (imageRes.x > 1 && imageRes.y > 1) {
    // Set canvas to exact image resolution - CSS will handle the scaling
    renderer.setSize(imageRes.x, imageRes.y, false);
    asciiMaterial.uniforms.uRes.value.set(imageRes.x, imageRes.y);
  } else {
    // Fallback to display size
    renderer.setSize(asciiRect.width, asciiRect.height, false);
    asciiMaterial.uniforms.uRes.value.set(asciiRect.width, asciiRect.height);
  }
}

/* ==== Video path ==== */
function loadVideo(src){
  // cleanup previous
  if(vidElement){ vidElement.pause(); vidElement.src = ''; vidElement.remove(); vidElement = null; }
  vidElement = document.createElement('video');
  vidElement.src = src;
  vidElement.muted = true;
  vidElement.loop = true;
  vidElement.crossOrigin = 'anonymous';
  vidElement.playsInline = true;
  vidElement.autoplay = true;
  vidElement.style.display = 'none';
  document.body.appendChild(vidElement);
  vidElement.addEventListener('canplay', ()=>{
    inputIsVideo = true;
    if(videoTexture) videoTexture.dispose();
    videoTexture = new THREE.VideoTexture(vidElement);
    videoTexture.minFilter = THREE.LinearFilter;
    videoTexture.magFilter = THREE.LinearFilter;
    
    // Update image resolution uniform
    asciiMaterial.uniforms.uImageRes.value.set(vidElement.videoWidth, vidElement.videoHeight);
    
    // Calculate aspect ratio for original display
    const aspectRatio = vidElement.videoWidth / vidElement.videoHeight;
    
    // Set texture for both ASCII and original display
    asciiMaterial.uniforms.uInput.value = videoTexture;
    originalQuad.material.uniforms.uTexture.value = videoTexture;
    originalQuad.material.uniforms.uAspect.value = aspectRatio;
    originalQuad.material.needsUpdate = true;
    
    // Save source for CPU side ASCII copying
    currentSource = vidElement;
    
    // Resize canvases to match new image resolution
    onResize();
    
    vidElement.play();
    drop.innerHTML = `
      <svg style="width: 18px; height: 18px; margin-bottom: 4px; color: #10b981;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>Video Loaded</span>
    `;
    
    // Update Play/Pause button state
    playPauseBtn.innerHTML = `
      <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="currentColor">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>

  });
}

/* ==== Image path ==== */
function loadImage(src){
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = ()=> {
    inputIsVideo = false;
    if(imageTexture) imageTexture.dispose();

    // Store raw image for re-scaling later
    rawImageElement = img;
    originalImageW = img.width;
    originalImageH = img.height;

    applyImageScale(activeScaleW, true /* first load */);

    drop.innerHTML = `
      <svg style="width: 18px; height: 18px; margin-bottom: 4px; color: #10b981;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>Image Loaded</span>
    `;
  };
  img.onerror = (e) => {
    console.error('Failed to load image:', e);
    drop.textContent = 'Error loading image';
  };
  img.src = src;
}

/**
 * Re-sample rawImageElement to targetW pixels wide (aspect-preserving).
 * targetW = 0 means use the original resolution.
 * When firstLoad = true the texture disposal is skipped (already done by caller).
 */
function applyImageScale(targetW, firstLoad = false) {
  if (!rawImageElement) return;

  const srcW = originalImageW;
  const srcH = originalImageH;
  const dstW = (targetW > 0 && targetW < srcW) ? targetW : srcW;
  const dstH = Math.round(dstW * srcH / srcW);

  const canvas = document.createElement('canvas');
  canvas.width  = dstW;
  canvas.height = dstH;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(rawImageElement, 0, 0, dstW, dstH);

  if (!firstLoad && imageTexture) imageTexture.dispose();

  imageTexture = new THREE.CanvasTexture(canvas);
  imageTexture.minFilter = THREE.LinearFilter;
  imageTexture.magFilter = THREE.LinearFilter;
  imageTexture.needsUpdate = true;

  const aspectRatio = dstW / dstH;

  asciiMaterial.uniforms.uImageRes.value.set(dstW, dstH);
  asciiMaterial.uniforms.uInput.value = imageTexture;
  originalQuad.material.uniforms.uTexture.value = imageTexture;
  originalQuad.material.uniforms.uAspect.value = aspectRatio;
  originalQuad.material.needsUpdate = true;

  currentSource = canvas;

  onResize();

  // Update info text
  const resInfo = document.getElementById('resInfo');
  if (resInfo) {
    resInfo.textContent = `${dstW} × ${dstH} px`;
  }
}

function setActiveChip(chip) {
  presetChips.forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
}

presetChips.forEach(chip => {
  chip.addEventListener('click', () => {
    if (inputIsVideo) {
      showToastNotification('Scale applies to images only — video uses native res', 'error');
      return;
    }
    const w = parseInt(chip.dataset.w, 10);
    activeScaleW = w;
    resWidthInput.value = w > 0 ? w : '';
    setActiveChip(chip);
    applyImageScale(w);
  });
});

function applyCustomRes() {
  if (inputIsVideo) {
    showToastNotification('Scale applies to images only — video uses native res', 'error');
    return;
  }
  const w = parseInt(resWidthInput.value, 10);
  if (!w || w < 64 || w > 4096) {
    showToastNotification('Enter a width between 64 and 4096 px', 'error');
    return;
  }
  activeScaleW = w;
  // Deactivate all preset chips (custom value)
  presetChips.forEach(c => c.classList.remove('active'));
  applyImageScale(w);
}

themeSelect.addEventListener('change', ()=>{
  const selectedTheme = themeSelect.value;
  const p = THEMES[selectedTheme];
  
  if (selectedTheme === 'none') {
    asciiMaterial.uniforms.uPalette0.value.set(0, 0, 0);
    asciiMaterial.uniforms.uPalette1.value.set(1, 1, 1);
    asciiMaterial.uniforms.uColorize.value = 1.0;
    colorizeCheckbox.checked = true;
  } else if (selectedTheme === 'bw') {
    asciiMaterial.uniforms.uPalette0.value.set(0, 0, 0);
    asciiMaterial.uniforms.uPalette1.value.set(1, 1, 1);
    asciiMaterial.uniforms.uColorize.value = 0.0;
    colorizeCheckbox.checked = false;
  } else {
    // Apply selected theme colors
    asciiMaterial.uniforms.uPalette0.value.set(
      parseInt(p.bg.slice(1,3),16)/255,
      parseInt(p.bg.slice(3,5),16)/255,
      parseInt(p.bg.slice(5,7),16)/255
    );
    asciiMaterial.uniforms.uPalette1.value.set(
      parseInt(p.fg.slice(1,3),16)/255,
      parseInt(p.fg.slice(3,5),16)/255,
      parseInt(p.fg.slice(5,7),16)/255
    );
    // Re-enable colorization if it was disabled
    if (asciiMaterial.uniforms.uColorize.value === 0.0) {
      asciiMaterial.uniforms.uColorize.value = 1.0;
      colorizeCheckbox.checked = true;
    }
  }
});

// Video export functionality
async function exportVideoAsMP4() {
  if (!vidElement) return;
  
  // Show progress with spinner
  const originalBtnHTML = snapshotBtn.innerHTML;
  snapshotBtn.innerHTML = `
    <svg style="width: 14px; height: 14px; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
      <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="0.75"></path>
    </svg>
    Processing...
  `;
  snapshotBtn.disabled = true;
  
  try {
    const duration = vidElement.duration;
    const fps = 30;
    
    // Create MediaRecorder for the export
    const canvasStream = asciiCanvas.captureStream(fps);
    const recordedBlobs = [];
    
    let mediaRecorder;
    let actualMimeType = '';
    
    // Check what formats are supported
    const mp4Supported = MediaRecorder.isTypeSupported('video/mp4;codecs=h264');
    const webmVP9Supported = MediaRecorder.isTypeSupported('video/webm;codecs=vp9');
    const webmVP8Supported = MediaRecorder.isTypeSupported('video/webm;codecs=vp8');
    
    try {
      if (mp4Supported) {
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/mp4;codecs=h264' });
        actualMimeType = 'video/mp4';
      } else if (webmVP9Supported) {
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp9' });
        actualMimeType = 'video/webm';
      } else if (webmVP8Supported) {
        mediaRecorder = new MediaRecorder(canvasStream, { mimeType: 'video/webm;codecs=vp8' });
        actualMimeType = 'video/webm';
      } else {
        mediaRecorder = new MediaRecorder(canvasStream);
        actualMimeType = 'video/webm';
      }
    } catch (e) {
      mediaRecorder = new MediaRecorder(canvasStream);
      actualMimeType = 'video/webm';
    }
    
    mediaRecorder.ondataavailable = (e) => { 
      if (e.data && e.data.size) recordedBlobs.push(e.data); 
    };
    
    mediaRecorder.onstop = () => {
      const extension = actualMimeType.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(recordedBlobs, { type: actualMimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); 
      a.href = url; 
      a.download = `ascii_video.${extension}`; 
      a.click();
      URL.revokeObjectURL(url);
      
      snapshotBtn.innerHTML = originalBtnHTML;
      snapshotBtn.disabled = false;
    };
    
    // Start recording
    mediaRecorder.start();
    
    vidElement.currentTime = 0;
    await new Promise(resolve => {
      vidElement.addEventListener('seeked', resolve, { once: true });
    });
    
    vidElement.play();
    
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }, (duration + 0.5) * 1000);
    
  } catch (error) {
    console.error('Export failed:', error);
    snapshotBtn.innerHTML = originalBtnHTML;
    snapshotBtn.disabled = false;
    showToastNotification('Export failed. Try again.', 'error');
  }
}

}

copyTextBtn.addEventListener('click', async () => {
  if (!currentSource) {
    showToastNotification('No source loaded to copy', 'error');
    return;
  }
  
  const originalHTML = copyTextBtn.innerHTML;
  copyTextBtn.innerHTML = `
    <svg style="width: 14px; height: 14px; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
      <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="0.75"></path>
    </svg>
    Generating...
  `;
  copyTextBtn.disabled = true;
  
  try {
    const cellSize = Number(cellRange.value);
    
    // Get source dimensions
    let sourceWidth = 256;
    let sourceHeight = 256;
    
    if (inputIsVideo && vidElement) {
      sourceWidth = vidElement.videoWidth;
      sourceHeight = vidElement.videoHeight;
    } else if (currentSource instanceof HTMLCanvasElement) {
      sourceWidth = currentSource.width;
      sourceHeight = currentSource.height;
    }
    
    const cols = Math.floor(sourceWidth / cellSize);
    const rows = Math.floor(sourceHeight / cellSize);
    
    if (cols <= 0 || rows <= 0) {
      throw new Error('Invalid grid size');
    }
    
    // Create temporary canvas to downscale source to grid resolution
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = cols;
    tempCanvas.height = rows;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(currentSource, 0, 0, cols, rows);
    
    const imgData = tempCtx.getImageData(0, 0, cols, rows);
    const data = imgData.data;
    
    const gamma = Number(gammaRange.value);
    const drawEdges = drawEdgesCheckbox.checked;
    const drawFill = drawFillCheckbox.checked;
    const edgeThreshold = Number(edgeThresholdRange.value);
    
    // Calculate luminance values for grid cells
    const lums = new Float32Array(cols * rows);
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const idx = (y * cols + x) * 4;
        const r = data[idx] / 255;
        const g = data[idx+1] / 255;
        const b = data[idx+2] / 255;
        const lum = 0.2127 * r + 0.7152 * g + 0.0722 * b;
        lums[y * cols + x] = Math.pow(Math.max(0.00001, lum), 1.0 / gamma);
      }
    }
    
    const getLum = (cx, cy) => {
      const x = Math.max(0, Math.min(cols - 1, cx));
      const y = Math.max(0, Math.min(rows - 1, cy));
      return lums[y * cols + x];
    };
    
    // Match the glyph textures used in the WebGL shader
    const fillChars = [' ', '.', ':', 'c', 'o', 'p', '0', '?', '&', '@'];
    const edgeChars = [' ', '|', '-', '/', '\\'];
    
    let plainText = '';
    let htmlContent = '';
    
    const isColorized = colorizeCheckbox.checked;
    const currentTheme = themeSelect.value;
    const themeColors = THEMES[currentTheme] || { bg: '#000000', fg: '#ffffff' };
    
    for (let y = 0; y < rows; y++) {
      let plainLine = '';
      let htmlLine = '';
      
      for (let x = 0; x < cols; x++) {
        let char = ' ';
        
        if (drawEdges) {
          // Sobel edge filter on CPU
          const tl = getLum(x - 1, y - 1);
          const tm = getLum(x, y - 1);
          const tr = getLum(x + 1, y - 1);
          const ml = getLum(x - 1, y);
          const mr = getLum(x + 1, y);
          const bl = getLum(x - 1, y + 1);
          const bm = getLum(x, y + 1);
          const br = getLum(x + 1, y + 1);
          
          const gx = (tr + 2 * mr + br) - (tl + 2 * ml + bl);
          const gy = (bl + 2 * bm + br) - (tl + 2 * tm + tr);
          
          const edgeMag = Math.sqrt(gx * gx + gy * gy);
          
          if (edgeMag > edgeThreshold) {
            const theta = Math.atan2(gy, gx);
            const absTheta = Math.abs(theta) / Math.PI;
            let direction = -1;
            
            if ((absTheta >= 0.0 && absTheta < 0.05) || (absTheta > 0.9 && absTheta <= 1.0)) {
              direction = 1; // Vertical
            } else if (absTheta > 0.45 && absTheta < 0.55) {
              direction = 2; // Horizontal
            } else if (absTheta > 0.05 && absTheta < 0.45) {
              direction = theta > 0.0 ? 4 : 3;
            } else if (absTheta > 0.55 && absTheta < 0.9) {
              direction = theta > 0.0 ? 3 : 4;
            }
            
            if (direction >= 1) {
              char = edgeChars[direction];
            }
          }
        }
        
        if (char === ' ' && drawFill) {
          const lum = lums[y * cols + x];
          const quantizedLum = Math.max(0, Math.min(9, Math.floor(lum * 10)));
          char = fillChars[quantizedLum];
        }
        
        plainLine += char;
        
        // Build colorized HTML segment
        let htmlChar = char;
        if (char === ' ') htmlChar = ' ';
        else if (char === '<') htmlChar = '&lt;';
        else if (char === '>') htmlChar = '&gt;';
        else if (char === '&') htmlChar = '&amp;';
        
        if (isColorized && currentTheme !== 'none') {
          const idx = (y * cols + x) * 4;
          const r = data[idx];
          const g = data[idx+1];
          const b = data[idx+2];
          htmlLine += `<span style="color: rgb(${r},${g},${b});">${htmlChar}</span>`;
        } else {
          htmlLine += htmlChar;
        }
      }
      
      plainText += plainLine + '\n';
      htmlContent += htmlLine + '\n';
    }
    
    // Rich HTML representation to preserve style when pasting in RTFs (Word, Google Docs, Slack etc.)
    const fullHtml = `<pre style="font-family: 'JetBrains Mono', monospace, Courier; font-size: 8px; line-height: 1.0; letter-spacing: 0px; background-color: ${themeColors.bg}; color: ${themeColors.fg}; padding: 16px; border-radius: 8px; margin: 0; white-space: pre; word-wrap: normal;">${htmlContent}</pre>`;
    
    const textBlob = new Blob([plainText], { type: 'text/plain' });
    const htmlBlob = new Blob([fullHtml], { type: 'text/html' });
    
    const clipboardItem = new ClipboardItem({
      'text/plain': textBlob,
      'text/html': htmlBlob
    });
    
    await navigator.clipboard.write([clipboardItem]);
    showToastNotification('ASCII copied! (Plain text + Colors)');
    
    copyTextBtn.innerHTML = `
      <svg style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      Copied!
    `;
    setTimeout(() => {
      copyTextBtn.innerHTML = originalHTML;
      copyTextBtn.disabled = false;
    }, 2000);
    
  } catch (err) {
    console.error('Failed to copy ASCII:', err);
    showToastNotification('Clipboard write failed', 'error');
    copyTextBtn.innerHTML = originalHTML;
    copyTextBtn.disabled = false;
  }
});

/* ==== Background Removal ==== */
const removeBgBtn = document.getElementById('removeBgBtn');
const bgColorPicker = document.getElementById('bgColorPicker');
const bgTransparent = document.getElementById('bgTransparent');

let bgRemovedBlob = null; // Store the ML output blob

removeBgBtn.addEventListener('click', async () => {
  if (inputIsVideo) {
    showToastNotification('Background removal applies to images only', 'error');
    return;
  }
  if (!rawImageElement) {
    showToastNotification('Load an image first', 'error');
    return;
  }

  const originalHTML = removeBgBtn.innerHTML;
  removeBgBtn.innerHTML = `
    <svg style="width: 14px; height: 14px; animation: spin 1s linear infinite;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle>
      <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="0.75"></path>
    </svg>
    Removing...
  `;
  removeBgBtn.disabled = true;

  try {
    const { removeBackground } = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm');
    
    // Process the image with performance config
    const quality = document.getElementById('bgQualitySelect').value;
    bgRemovedBlob = await removeBackground(rawImageElement.src, {
      model: quality,
      device: 'gpu'
    });
    
    applyBackgroundSettings();
    showToastNotification('Background removed!');
  } catch (err) {
    console.error('BG removal failed:', err);
    showToastNotification('Removal failed', 'error');
  } finally {
    removeBgBtn.innerHTML = originalHTML;
    removeBgBtn.disabled = false;
  }
});

function applyBackgroundSettings() {
  if (!bgRemovedBlob) return;
  
  const url = URL.createObjectURL(bgRemovedBlob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    
    if (!bgTransparent.checked) {
      ctx.fillStyle = bgColorPicker.value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.drawImage(img, 0, 0);
    
    const newImg = new Image();
    newImg.onload = () => {
      rawImageElement = newImg;
      originalImageW = newImg.width;
      originalImageH = newImg.height;
      applyImageScale(activeScaleW, false);
    };
    newImg.src = canvas.toDataURL('image/png');
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

bgColorPicker.addEventListener('input', () => {
  if(bgTransparent.checked) {
    bgTransparent.checked = false; // Auto-uncheck transparent if user picks a color
  }
  applyBackgroundSettings();
});
bgTransparent.addEventListener('change', applyBackgroundSettings);

/* ==== init default theme values ==== */
(function initDefaults(){
  asciiMaterial.uniforms.uCell.value = Number(cellRange.value);
  cellVal.textContent = cellRange.value;
  
  asciiMaterial.uniforms.uColorize.value = colorizeCheckbox.checked ? 1.0 : 0.0;
  
  asciiMaterial.uniforms.uGamma.value = Number(gammaRange.value);
  gammaVal.textContent = Number(gammaRange.value).toFixed(2);
  
  asciiMaterial.uniforms.uEdgeThreshold.value = Number(edgeThresholdRange.value);
  edgeThresholdVal.textContent = Number(edgeThresholdRange.value).toFixed(2);
  
  asciiMaterial.uniforms.uDrawEdges.value = drawEdgesCheckbox.checked;
  asciiMaterial.uniforms.uDrawFill.value = drawFillCheckbox.checked;
  
  // Set default theme to OneDark
  themeSelect.value = 'onedark';
  themeSelect.dispatchEvent(new Event('change'));
})();

</script>
